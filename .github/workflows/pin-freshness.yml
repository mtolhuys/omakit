name: Marketplace pin freshness

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-freshness
  cancel-in-progress: false

# The inspect job reads the public marketplace through Omakit's single GET
# path. Only reconcile-issue can write, and its token is scoped to issues in
# this repository; no job can write to omacom/omarchy-plugin-marketplace.
jobs:
  inspect:
    name: Read the pin and marketplace HEAD
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.freshness.outputs.state }}
      pinned: ${{ steps.freshness.outputs.pinned }}
      head: ${{ steps.freshness.outputs.head }}
      branch: ${{ steps.freshness.outputs.branch }}
      moved: ${{ steps.freshness.outputs.moved }}
      verdict_moved: ${{ steps.freshness.outputs.verdict_moved }}
      missing: ${{ steps.freshness.outputs.missing }}
      forms: ${{ steps.freshness.outputs.forms }}
      reads: ${{ steps.freshness.outputs.reads }}
      policy_pin: ${{ steps.freshness.outputs.policy_pin }}
      policy_head: ${{ steps.freshness.outputs.policy_head }}
      detail: ${{ steps.freshness.outputs.detail }}

    steps:
      - name: Check out the exact revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read the immutable pin identity
        id: pin
        shell: bash
        run: |
          commit=$(node --input-type=module --eval 'import { MARKETPLACE_PIN } from "./tools/marketplace/pin.mjs"; process.stdout.write(MARKETPLACE_PIN.commit)')
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "MARKETPLACE_PIN.commit is not a full commit: $commit" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # There is deliberately no date or restore prefix in this key. The pin
      # is an exact immutable commit, so this cache can never become stale.
      - name: Restore the pinned marketplace checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/omakit/marketplace
          key: omakit-marketplace-${{ runner.os }}-${{ steps.pin.outputs.commit }}

      - name: Fetch or verify the marketplace pin
        run: ./bin/omakit pin

      # doctor compares what omakit reads between the pin and HEAD
      # (docs/UPSTREAM_CONTRACT.md, "What moved since the pin"): the files
      # it reads under scripts/ by blob id, the issue templates by tree id,
      # the two policy constants by their text at HEAD. `ok` when none of
      # those moved (unequal commits are normal here: the registry moves
      # about 140 times a day and is read live; measured on the run of
      # 2026-09-14, this step failed every week by demanding equal commits),
      # `info` when the only read files that moved are ones omakit takes
      # wording or a label out of (WORDING_READS in pin.mjs), `advice` when
      # a file omakit executes or reads a rule from moved (with or without
      # a policy constant differing: a rule can change without its
      # version), a read file is gone, or the form moved. Measured on
      # 2026-09-21 (M7): the tree comparison before this graded 5e401552,
      # which changed only repository-identity.mjs, as advice, and the pin
      # moved for a verdict that could not change.
      - name: Read structured freshness evidence
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./bin/omakit doctor --json > "$RUNNER_TEMP/doctor.json"
          count=$(jq '[.checks[] | select(.id == "pin.freshness")] | length' "$RUNNER_TEMP/doctor.json")
          if [[ "$count" -ne 1 ]]; then
            echo "doctor returned $count pin.freshness checks, expected exactly one" >&2
            exit 1
          fi
          check='.checks[] | select(.id == "pin.freshness")'
          state=$(jq -r "$check | .state" "$RUNNER_TEMP/doctor.json")
          pinned=$(jq -r "$check | .evidence.pinCommit // empty" "$RUNNER_TEMP/doctor.json")
          head=$(jq -r "$check | .evidence.marketplaceHead // empty" "$RUNNER_TEMP/doctor.json")
          branch=$(jq -r "$check | .evidence.branch // empty" "$RUNNER_TEMP/doctor.json")
          moved=$(jq -r "$check | (.evidence.moved // []) | join(\", \")" "$RUNNER_TEMP/doctor.json")
          verdict_moved=$(jq -r "$check | (.evidence.verdictMoved // []) | join(\", \")" "$RUNNER_TEMP/doctor.json")
          missing=$(jq -r "$check | (.evidence.missing // []) | join(\", \")" "$RUNNER_TEMP/doctor.json")
          forms=$(jq -r "$check | (.evidence.pinned // []) | map(select(startswith(\"/.github/\"))) | join(\", \")" "$RUNNER_TEMP/doctor.json")
          reads=$(jq -r "$check | .evidence.reads // empty" "$RUNNER_TEMP/doctor.json")
          policy_pin=$(jq -r "$check | .evidence.policy.pin // empty | \"baseline \\(.baselineVersion) (\\(.enforcementMode))\"" "$RUNNER_TEMP/doctor.json")
          policy_head=$(jq -r "$check | .evidence.policy.head // empty | \"baseline \\(.baselineVersion) (\\(.enforcementMode))\"" "$RUNNER_TEMP/doctor.json")
          detail=$(jq -r "$check | .detail" "$RUNNER_TEMP/doctor.json")
          echo "pin.freshness: $state; $detail"
          if [[ "$state" != "ok" && "$state" != "info" && "$state" != "advice" ]]; then
            echo "pin freshness is $state; refusing to change an issue without a measured HEAD" >&2
            exit 1
          fi
          if [[ ! "$pinned" =~ ^[0-9a-f]{40}$ || ! "$head" =~ ^[0-9a-f]{40}$ || -z "$branch" || ! "$reads" =~ ^[0-9]+$ ]]; then
            echo "pin freshness evidence is missing or malformed" >&2
            exit 1
          fi
          if [[ "$state" == "ok" && -n "$moved$missing$forms" ]]; then
            echo "doctor called the pin current while something it reads moved: $moved $missing $forms" >&2
            exit 1
          fi
          if [[ "$state" == "info" && ( -z "$moved" || -n "$verdict_moved$missing$forms" || "$policy_pin" != "$policy_head" ) ]]; then
            echo "doctor graded info without a moved read file, or with a difference that can change a verdict: $verdict_moved $missing $forms" >&2
            exit 1
          fi
          if [[ "$state" != "ok" && "$pinned" == "$head" ]]; then
            echo "doctor called equal commits behind" >&2
            exit 1
          fi
          {
            echo "state=$state"
            echo "pinned=$pinned"
            echo "head=$head"
            echo "branch=$branch"
            echo "moved=$moved"
            echo "verdict_moved=$verdict_moved"
            echo "missing=$missing"
            echo "forms=$forms"
            echo "reads=$reads"
            echo "policy_pin=$policy_pin"
            echo "policy_head=$policy_head"
            echo "detail=$detail"
          } >> "$GITHUB_OUTPUT"

  reconcile-issue:
    name: Keep exactly one current-repository issue
    needs: inspect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Create, update, reopen, or close the one freshness issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.inspect.outputs.state }}
          PINNED: ${{ needs.inspect.outputs.pinned }}
          HEAD_COMMIT: ${{ needs.inspect.outputs.head }}
          HEAD_BRANCH: ${{ needs.inspect.outputs.branch }}
          MOVED: ${{ needs.inspect.outputs.moved }}
          VERDICT_MOVED: ${{ needs.inspect.outputs.verdict_moved }}
          MISSING: ${{ needs.inspect.outputs.missing }}
          FORMS: ${{ needs.inspect.outputs.forms }}
          READS: ${{ needs.inspect.outputs.reads }}
          POLICY_PIN: ${{ needs.inspect.outputs.policy_pin }}
          POLICY_HEAD: ${{ needs.inspect.outputs.policy_head }}
          DETAIL: ${{ needs.inspect.outputs.detail }}
        run: |
          title="[automation] Marketplace pin differs from HEAD"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" > "$RUNNER_TEMP/issues.json"
          jq --arg title "$title" '[.[][] | select(has("pull_request") | not) | select(.title == $title)]' "$RUNNER_TEMP/issues.json" > "$RUNNER_TEMP/matches.json"
          count=$(jq length "$RUNNER_TEMP/matches.json")
          if [[ "$count" -gt 1 ]]; then
            echo "found $count exact freshness issues; refusing to choose or mutate one" >&2
            exit 1
          fi
          if [[ "$STATE" == "advice" ]]; then
            grade="\`advice\`: a verdict omakit gives may differ at HEAD (a file it executes or reads a rule from moved, a policy constant differs, a read file is gone, or the form moved)."
          else
            grade="\`info\`: only files omakit takes wording or a label out of moved; what it prints may differ at HEAD, what it decides cannot. The pin can follow with the next release."
          fi
          cat > "$RUNNER_TEMP/issue-body.md" <<EOF
          Something Omakit reads only from its immutable marketplace pin has changed on the marketplace's current \`${HEAD_BRANCH}\`-branch HEAD. \`omakit doctor\` grades it ${grade}

          - Omakit pin: \`${PINNED}\`
          - Marketplace HEAD: \`${HEAD_COMMIT}\`
          - Files omakit reads under \`scripts/\` that moved (of ${READS}): \`${MOVED:-none}\`
          - Of those, files a verdict can depend on: \`${VERDICT_MOVED:-none}\`
          - Files omakit reads that are gone at HEAD: \`${MISSING:-none}\`
          - Form directory that moved: \`${FORMS:-none}\`
          - Policy constants: ${POLICY_PIN} at the pin, ${POLICY_HEAD} at HEAD
          - Doctor's line: ${DETAIL}

          Updating the pin is deliberate work. Follow [docs/UPSTREAM_CONTRACT.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/UPSTREAM_CONTRACT.md), including the 30-repository parity proof and committed evidence. This workflow reports the difference; it never advances the pin.
          EOF
          if [[ "$STATE" == "advice" || "$STATE" == "info" ]]; then
            if [[ "$count" -eq 0 ]]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue-body.md"
            else
              number=$(jq -r '.[0].number' "$RUNNER_TEMP/matches.json")
              issue_state=$(jq -r '.[0].state' "$RUNNER_TEMP/matches.json")
              if [[ "$issue_state" == "closed" ]]; then
                gh issue reopen "$number" --repo "$GITHUB_REPOSITORY"
              fi
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue-body.md"
            fi
          elif [[ "$STATE" == "ok" ]]; then
            if [[ "$count" -eq 1 && "$(jq -r '.[0].state' "$RUNNER_TEMP/matches.json")" == "open" ]]; then
              number=$(jq -r '.[0].number' "$RUNNER_TEMP/matches.json")
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Nothing Omakit reads from the pin has moved: pin \`${PINNED}\`, marketplace ${HEAD_BRANCH}-branch HEAD \`${HEAD_COMMIT}\`."
            fi
          else
            echo "unexpected freshness state $STATE; refusing to mutate an issue" >&2
            exit 1
          fi
