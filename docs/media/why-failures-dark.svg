<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t"><title id="t">An unguarded child process has four ordinary endings: a frozen widget, a slowed desktop, a surviving orphan, and whichever program PATH picked</title>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#e5ecf3"/></marker>
<marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#72a9dd"/></marker>
</defs>
<g font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
<rect x="8" y="126" width="120" height="48" rx="4" fill="none" stroke="#72a9dd" stroke-width="2"/>
<text x="68" y="155" text-anchor="middle" fill="#72a9dd">your plugin</text>

<line x1="128" y1="150" x2="196" y2="150" stroke="#e5ecf3" stroke-width="1.5" marker-end="url(#ink)"/>
<text x="162" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#e5ecf3">git</text>

<rect x="198" y="126" width="118" height="48" rx="4" fill="none" stroke="#e5ecf3" stroke-width="1.5"/>
<text x="257" y="155" text-anchor="middle" fill="#e5ecf3">child process</text>

<line x1="316" y1="140" x2="386" y2="46" stroke="#94a2b1" stroke-width="1.2" marker-end="url(#ink)"/>
<line x1="316" y1="146" x2="386" y2="116" stroke="#94a2b1" stroke-width="1.2" marker-end="url(#ink)"/>
<line x1="316" y1="156" x2="386" y2="186" stroke="#94a2b1" stroke-width="1.2" marker-end="url(#ink)"/>
<line x1="316" y1="162" x2="386" y2="256" stroke="#94a2b1" stroke-width="1.2" marker-end="url(#ink)"/>

<text x="394" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" fill="#d68a4b">never returns</text>
<text x="394" y="52" fill="#e5ecf3">the widget is frozen, for good</text>

<text x="394" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" fill="#d68a4b">prints 10 MB</text>
<text x="394" y="122" fill="#e5ecf3">the whole desktop slows down</text>

<text x="394" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" fill="#d68a4b">panel closes</text>
<text x="394" y="192" fill="#e5ecf3">the child keeps running, unwatched</text>

<text x="394" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" fill="#d68a4b">PATH decides</text>
<text x="394" y="262" fill="#e5ecf3">another process can answer to the name</text>
</g>
</svg>
