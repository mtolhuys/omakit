<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 266" width="640" height="266" role="img" aria-labelledby="t"><title id="t">A run boots a disposable guest from a read-only base through an overlay of its own, runs the suite in a session like a person's, and returns a document naming the guest it ran on; the desktop is not touched and the overlay is removed</title>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#e5ecf3"/></marker>
<marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#72a9dd"/></marker>
</defs>
<g font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
<rect x="8" y="40" width="150" height="42" rx="4" fill="none" stroke="#72a9dd" stroke-width="2"/>
<text x="83" y="66" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#72a9dd">omakit lab prove</text>
<line x1="158" y1="61" x2="194" y2="61" stroke="#72a9dd" stroke-width="1.5" marker-end="url(#acc)"/>

<rect x="198" y="16" width="434" height="140" rx="6" fill="none" stroke="#72a9dd" stroke-width="2" stroke-dasharray="4 3"/>
<text x="214" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#72a9dd">a disposable Omarchy guest</text>

<rect x="214" y="48" width="150" height="46" rx="4" fill="none" stroke="#e5ecf3" stroke-width="1.2"/>
<text x="289" y="70" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#e5ecf3">base.qcow2</text>
<text x="289" y="86" text-anchor="middle" font-size="10" fill="#94a2b1">read-only, 0444</text>
<line x1="364" y1="71" x2="394" y2="71" stroke="#e5ecf3" stroke-width="1.2" marker-end="url(#ink)"/>
<rect x="396" y="48" width="150" height="46" rx="4" fill="none" stroke="#e5ecf3" stroke-width="1.2"/>
<text x="471" y="70" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#e5ecf3">overlay</text>
<text x="471" y="86" text-anchor="middle" font-size="10" fill="#94a2b1">this run only</text>

<rect x="214" y="106" width="332" height="36" rx="4" fill="none" stroke="#e5ecf3" stroke-width="1.2"/>
<text x="380" y="129" text-anchor="middle" font-size="11" fill="#e5ecf3">the suite runs in a session the way a person gets one</text>

<line x1="415" y1="156" x2="415" y2="184" stroke="#e5ecf3" stroke-width="1.5" marker-end="url(#ink)"/>
<rect x="278" y="186" width="354" height="44" rx="4" fill="none" stroke="#72a9dd" stroke-width="2"/>
<text x="455" y="205" text-anchor="middle" font-size="11" fill="#72a9dd">the document</text>
<text x="455" y="221" text-anchor="middle" font-size="10" fill="#94a2b1">the guest it ran on, and what the suite did</text>

<rect x="8" y="186" width="240" height="44" rx="4" fill="none" stroke="#94a2b1" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="128" y="205" text-anchor="middle" font-size="11" fill="#94a2b1">the desktop you work on</text>
<text x="128" y="221" text-anchor="middle" font-size="10" fill="#94a2b1">not read, not written, not restarted</text>

<text x="8" y="256" font-size="11" fill="#94a2b1">when the run ends the overlay is removed, and the base is the same file it was</text>
</g>
</svg>
