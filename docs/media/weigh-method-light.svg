<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" width="640" height="292" role="img" aria-labelledby="t"><title id="t">A plugin's weight is the difference between two shells started clean, one without it and one with it, each run the same way and sampled at the end of a window</title>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#16202b"/></marker>
<marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#2f6fb0"/></marker>
</defs>
<g font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
<text x="8" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#2f6fb0">two shell configurations, three runs each</text>

<rect x="8" y="24" width="300" height="52" rx="4" fill="none" stroke="#16202b" stroke-width="1.5"/>
<text x="158" y="46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#16202b">baseline</text>
<text x="158" y="64" text-anchor="middle" font-size="10" fill="#5b6875">your enabled set, minus the plugin</text>
<rect x="332" y="24" width="300" height="52" rx="4" fill="none" stroke="#2f6fb0" stroke-width="2"/>
<text x="482" y="46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#2f6fb0">baseline plus one</text>
<text x="482" y="64" text-anchor="middle" font-size="10" fill="#5b6875">the same set, with that plugin enabled</text>

<line x1="158" y1="76" x2="158" y2="112" stroke="#16202b" stroke-width="1.2" marker-end="url(#ink)"/>
<line x1="482" y1="76" x2="482" y2="112" stroke="#2f6fb0" stroke-width="1.2" marker-end="url(#acc)"/>
<text x="320" y="98" text-anchor="middle" font-size="10" fill="#5b6875">each run, the same way</text>

<rect x="7" y="116" width="114" height="38" rx="4" fill="none" stroke="#16202b" stroke-width="1.2"/>
<text x="64" y="139" text-anchor="middle" font-size="10" fill="#16202b">write shell.json</text>
<line x1="121" y1="135" x2="133" y2="135" stroke="#16202b" stroke-width="1.2" marker-end="url(#ink)"/>
<rect x="135" y="116" width="114" height="38" rx="4" fill="none" stroke="#16202b" stroke-width="1.2"/>
<text x="192" y="139" text-anchor="middle" font-size="10" fill="#16202b">restart the shell</text>
<line x1="249" y1="135" x2="261" y2="135" stroke="#16202b" stroke-width="1.2" marker-end="url(#ink)"/>
<rect x="263" y="116" width="114" height="38" rx="4" fill="none" stroke="#16202b" stroke-width="1.2"/>
<text x="320" y="139" text-anchor="middle" font-size="10" fill="#16202b">wait for the plugins</text>
<line x1="377" y1="135" x2="389" y2="135" stroke="#16202b" stroke-width="1.2" marker-end="url(#ink)"/>
<rect x="391" y="116" width="114" height="38" rx="4" fill="none" stroke="#16202b" stroke-width="1.2"/>
<text x="448" y="139" text-anchor="middle" font-size="10" fill="#16202b">settle, 30 s</text>
<line x1="505" y1="135" x2="517" y2="135" stroke="#16202b" stroke-width="1.2" marker-end="url(#ink)"/>
<rect x="519" y="116" width="114" height="38" rx="4" fill="none" stroke="#2f6fb0" stroke-width="2"/>
<text x="576" y="139" text-anchor="middle" font-size="10" fill="#2f6fb0">window, 15 s</text>

<text x="8" y="176" font-size="11" fill="#5b6875">sampled at the end of the window: the shell's Pss, its CPU over the window, and the CPU of every child it reaped</text>

<line x1="320" y1="186" x2="320" y2="210" stroke="#16202b" stroke-width="1.5" marker-end="url(#ink)"/>
<rect x="170" y="212" width="300" height="46" rx="4" fill="none" stroke="#2f6fb0" stroke-width="2"/>
<text x="320" y="234" text-anchor="middle" font-size="11" fill="#2f6fb0">run i with, minus run i without</text>
<text x="320" y="250" text-anchor="middle" font-size="10" fill="#5b6875">the median, and the spread</text>

<text x="8" y="280" font-size="11" fill="#5b6875">measured from outside the process: nothing is read from the plugin's source, and no declared interval is believed</text>
</g>
</svg>
