<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="t"><title id="t">Store walks the directory chain by descriptor and writes through an exclusive temporary file that is renamed into place</title>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#16202b"/></marker>
<marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#2f6fb0"/></marker>
</defs>
<g font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
<text x="8" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" fill="#2f6fb0">reading</text>
<rect x="8" y="38" width="96" height="40" rx="4" fill="none" stroke="#16202b" stroke-width="1.2"/>
<text x="56" y="63" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" fill="#16202b">home</text>
<line x1="104" y1="58" x2="140" y2="58" stroke="#16202b" stroke-width="1.2" marker-end="url(#ink)"/>
<rect x="142" y="38" width="120" height="40" rx="4" fill="none" stroke="#16202b" stroke-width="1.2"/>
<text x="202" y="63" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" fill="#16202b">.local/state</text>
<line x1="262" y1="58" x2="298" y2="58" stroke="#16202b" stroke-width="1.2" marker-end="url(#ink)"/>
<rect x="300" y="38" width="120" height="40" rx="4" fill="none" stroke="#16202b" stroke-width="1.2"/>
<text x="360" y="63" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" fill="#16202b">your plugin</text>
<line x1="420" y1="58" x2="456" y2="58" stroke="#16202b" stroke-width="1.2" marker-end="url(#ink)"/>
<rect x="458" y="38" width="120" height="40" rx="4" fill="none" stroke="#2f6fb0" stroke-width="2"/>
<text x="518" y="63" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" fill="#2f6fb0">state.json</text>
<text x="8" y="100" fill="#5b6875">each step opened as a descriptor, never by name a second time,</text>
<text x="8" y="118" fill="#5b6875">so nothing can be swapped in between the check and the open</text>

<text x="8" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" fill="#2f6fb0">writing</text>
<rect x="8" y="158" width="150" height="40" rx="4" fill="none" stroke="#16202b" stroke-width="1.2"/>
<text x="83" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" fill="#16202b">.store-a1b2 (0600)</text>
<line x1="158" y1="178" x2="206" y2="178" stroke="#16202b" stroke-width="1.2" marker-end="url(#ink)"/>
<text x="182" y="168" text-anchor="middle" font-size="11" fill="#5b6875">fsync</text>
<rect x="208" y="158" width="130" height="40" rx="4" fill="none" stroke="#16202b" stroke-width="1.2"/>
<text x="273" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" fill="#16202b">rename</text>
<line x1="338" y1="178" x2="386" y2="178" stroke="#16202b" stroke-width="1.2" marker-end="url(#ink)"/>
<rect x="388" y="158" width="130" height="40" rx="4" fill="none" stroke="#2f6fb0" stroke-width="2"/>
<text x="453" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" fill="#2f6fb0">state.json</text>
<text x="8" y="220" fill="#5b6875">a reader never sees half a file, and a crash never leaves one</text>
</g>
</svg>
